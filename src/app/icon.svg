<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="rf-ai-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4C6EF5" />
      <stop offset="50%" stop-color="#9B5DE5" />
      <stop offset="100%" stop-color="#F15BB5" />
    </linearGradient>
    <linearGradient id="rf-wave-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9B5DE5" />
      <stop offset="100%" stop-color="#F15BB5" />
    </linearGradient>
    <filter id="rf-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#9B5DE5" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Squircle with AI Gradient Border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#0A0A12" stroke="url(#rf-ai-grad)" stroke-width="2.5" />

  <!-- Radio Waves Broadcast Logo -->
  <g stroke="url(#rf-wave-grad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#rf-glow)">
    <!-- Outer wave right -->
    <path d="M44 19 a 18 18 0 0 1 0 26" />
    <!-- Inner wave right -->
    <path d="M38 25 a 10 10 0 0 1 0 14" />

    <!-- Outer wave left -->
    <path d="M20 45 a 18 18 0 0 1 0 -26" />
    <!-- Inner wave left -->
    <path d="M26 39 a 10 10 0 0 1 0 -14" />

    <!-- Center Transmitter Core Dot -->
    <circle cx="32" cy="32" r="3.5" fill="#B4FF39" stroke="#0A0A12" stroke-width="1.5" />
  </g>
</svg>
